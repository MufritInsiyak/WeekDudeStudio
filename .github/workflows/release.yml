name: Publish GitHub Release (Android & Windows)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.2.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Restore or create persistent signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mission-map-apk-keystore-v1
      - name: Ensure signing keystore exists
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mission Map Debug,O=Android,C=US"
          fi
      - name: Resolve release version
        id: ver
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          if [[ ! "$CLEAN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CLEAN_VER="1.0.${{ github.run_number }}"
          fi
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug -PappVersionName="${{ steps.ver.outputs.version }}"
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "Mission-Map-Android-${{ steps.ver.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: Mission-Map-Android-*.apk

  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop dependencies
        shell: pwsh
        run: |
          if (Test-Path desktop/package-lock.json) {
            npm --prefix desktop ci
          } else {
            npm --prefix desktop install
          }
      - name: Sync version from tag if provided
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $cleanVer = $rawTag -replace '^v', ''
          if ($cleanVer -match '^\d+\.\d+\.\d+$') {
            $pkg = Get-Content desktop/package.json -Raw | ConvertFrom-Json
            $pkg.version = $cleanVer
            $pkg | ConvertTo-Json -Depth 10 | Set-Content desktop/package.json -Encoding UTF8
          }
      - name: Build Windows NSIS installer and portable executable
        run: npm --prefix desktop run dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-exe
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap

  publish-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Mission Map ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
