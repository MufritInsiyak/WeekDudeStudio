name: Build Android APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Restore or create persistent signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mission-map-apk-keystore-v1
      - name: Ensure signing keystore exists
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mission Map Debug,O=Android,C=US"
          fi
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mission-map-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
